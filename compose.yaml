services:
  server:
    image: server
    build:
      context: .
      dockerfile: Server/Dockerfile
    depends_on:
      - sqlserver
    
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: str1ngCh33se***
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - Test-db-checker:/var/opt/mssql
    secrets:
      - MSSQL_SA_PASSWORD
secrets:
  MSSQL_SA_PASSWORD:
    file: ./Server/secrets/SA_PASSWORD.txt
volumes:
  Test-db-checker: